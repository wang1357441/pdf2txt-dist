name: Build UOS (aarch64) single file

# 每次发版（或在 Actions 页面手动点一下）自动在 GitHub 原生 ARM 机器（ubuntu-24.04-arm）上
# 直接打出「统信 UOS / 鲲鹏」能运行的单个文件 PDFtoTXT_linux_aarch64，
# 上传到 Release 并写进更新清单，让 UOS 版也能「手动点击自动更新」。
# 用原生 ARM 机器，不再靠 QEMU 模拟，速度快 5~10 倍。
# 这样作者/用户都不用在自己的 UOS 上手动 build 了。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要附加上 UOS 单文件的 Release 版本号（例如 v1.0.7）"
        required: true
        default: "v1.0.7"

permissions:
  contents: write

jobs:
  build-uos:
    # 原生 ARM64 机器：真芯片，不模拟。公开仓库免费可用。
    runs-on: ubuntu-24.04-arm

    steps:
      # 总是从 main 取代码构建：main 上始终含完整源码（发布时 manifest 先提交到 main，
      # 所以 main 的代码就等于当次发布的代码）。如果改成按 tag 取，老 tag 可能早于源码入库而缺文件。
      - name: 拉代码
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 在 ARM 机器上打包出单个文件
        run: bash build_uos.sh

      - name: 上传到 Release 并补清单
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python3 .github/upload_uos_binary.py
